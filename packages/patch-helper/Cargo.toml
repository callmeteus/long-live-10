[package]
name = "patch-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ll10-patch-helper"
path = "src/main.rs"

[profile.release]
# Windows GUI subsystem - no console window
# (set via rustflags in .cargo/config or here)
panic = "abort"

[dependencies]
patch-runtime = { path = "../patch-runtime" }
ui-contract = { path = "../ui-contract" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
